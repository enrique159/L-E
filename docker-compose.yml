services:
  mysql:
    image: mysql:8.4
    container_name: wedding_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: wedding_invitation
      MYSQL_USER: wedding_user
      MYSQL_PASSWORD: wedding_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uwedding_user", "-pwedding_password"]
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - wedding_network

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: wedding_backend
    restart: unless-stopped
    environment:
      PORT: 3333
      JWT_SECRET: change-me-before-production
      JWT_EXPIRES_IN: 8h
      DB_HOST: mysql
      DB_PORT: 3306
      DB_USERNAME: wedding_user
      DB_PASSWORD: wedding_password
      DB_DATABASE: wedding_invitation
      DB_LOGGING: "false"
    ports:
      - "3333:3333"
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - wedding_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: wedding_frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - wedding_network

volumes:
  mysql_data:

networks:
  wedding_network:
    driver: bridge
